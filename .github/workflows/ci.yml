name: CI

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
  push:
    branches: [ main ]
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate-backend:
    name: Integrate Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: .NET Restore
        run: >
          dotnet restore AspireBoot.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: .NET Audit
        run: dotnet list AspireBoot.slnx package --vulnerable --include-transitive

      - name: .NET Build
        run: dotnet build AspireBoot.slnx -c Debug --no-restore

      - name: .NET Test Coverage
        run: >
          dotnet test AspireBoot.Tests/AspireBoot.Tests.csproj -c Debug --no-build
          /p:CollectCoverage=true
          /p:CoverletOutput=../artifacts/coverage/
          /p:CoverletOutputFormat=opencover
          /p:Threshold=90
          /p:ThresholdType=line
          /p:ThresholdStat=total

      - name: Upload .NET Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: error

  integrate-frontend:
    name: Integrate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AspireBoot.Angular

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: AspireBoot.Angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint Angular
        run: npm run lint

      - name: Build Angular
        run: npm run build

      - name: Test Angular with coverage
        run: npm run test:coverage
